name: Sync osu Ranked catalogue + publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
concurrency:
  # Collapse rapid UI commits into the newest deploy, without interrupting hourly data sync.
  group: osu-ranked-${{ github.event_name == 'push' && 'site-push' || 'scheduled-sync' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Serialize all writes to Ranked DB across regular sync and long backfill workflows.
    concurrency:
      group: osu-ranked-data-writer
      cancel-in-progress: false
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python source
        run: |
          python -m py_compile osu_api.py sync_catalog.py build_ranked_views.py build_chart_dna.py
          python -m unittest discover -s tests -q
      - name: Refresh newest maps and continue historical backfill
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: python sync_catalog.py --pages 200 --fresh-pages 1 --delay 1.0
      - name: Expand Chart DNA coverage (experimental)
        if: always()
        continue-on-error: true
        # Hourly budget: up to 120 real .osu charts, ~4 minutes of polite pacing.
        # The analyzer checkpoints every 20 attempts and stops gently on 403/429/503.
        run: python build_chart_dna.py --limit 300 --checkpoint-every 25 --delay 1
      - name: Build small dashboard summary and lazy search indexes
        if: always()
        run: python build_ranked_views.py
      - name: Publish completed pages even if a later API request fails
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only public catalogue and aggregate chart metrics.
          # Never stage any osu! user profile or profile configuration data.
          for path in data/ranked data/ranked-search data/ranked-manifest.json data/ranked-state.json data/ranked-summary.json data/chart-dna data/chart-dna-manifest.json data/chart-dna-state.json; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Sync osu Ranked metadata catalog"
            git push
          fi

  deploy:
    needs: sync
    if: always() && (github.event_name == 'push' || needs.sync.result == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: osu-ranked-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Build lightweight public statistics and search indexes
        run: |
          # A UI-only push must not be blocked from Pages by unrelated test failures.
          # Keep the already committed public summary if regeneration fails.
          if ! python build_ranked_views.py; then
            echo "::warning::Ranked summary rebuild failed; deploying committed data."
            test -s data/ranked-summary.json
          fi
      - name: Verify latest UI files before packaging
        run: |
          test -s index.html
          test -s ranked-catalog.js
          test -s data/ranked-summary.json
          echo "Deploying commit: $(git rev-parse HEAD)"
          grep -o 'ranked-catalog.js?v=[0-9]*' index.html | tail -1
      - name: Prepare static Skill Lab site
        run: |
          mkdir -p _site
          cp index.html app-shell.css ranked-catalog.js profile.js mobile-analyzer.js mobile-replay.js manifest.webmanifest sw.js version.json _site/
          cp -R data _site/data
          # Defense in depth: never deploy user-profile snapshots even if a local file exists.
          rm -f _site/data/osu-profile.json _site/data/profile-config.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
