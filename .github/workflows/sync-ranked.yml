name: Sync osu Ranked catalogue + publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
concurrency:
  group: osu-ranked-sync-and-deploy
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python source
        run: python -m py_compile osu_api.py sync_catalog.py
      - name: Refresh newest maps and continue historical backfill
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: python sync_catalog.py --pages 200 --fresh-pages 1 --delay 1.0
      - name: Publish completed pages even if a later API request fails
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ranked/ data/ranked-manifest.json data/ranked-state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Sync osu Ranked metadata catalog"
            git push
          fi

  deploy:
    needs: sync
    if: always() && (github.event_name == 'push' || needs.sync.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare static Skill Lab site
        run: |
          mkdir -p _site
          cp index.html mobile-analyzer.js manifest.webmanifest sw.js version.json _site/
          cp -R data _site/data
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
