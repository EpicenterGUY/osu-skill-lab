name: Backfill Ranked Chart DNA

on:
  workflow_dispatch:
  schedule:
    - cron: "43 * * * *"

concurrency:
  group: osu-chart-dna-backfill
  cancel-in-progress: false

jobs:
  dna:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    concurrency:
      # Serialize writes with the hourly Ranked metadata collector.
      group: osu-ranked-data-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate analyzer and UI contracts
        run: |
          python -m py_compile build_chart_dna.py build_ranked_views.py
          python -m unittest discover -s tests -q
          python build_chart_dna.py --help
      - name: Analyze adaptive recoverable DNA batch
        shell: bash
        run: |
          set -euo pipefail
          # Request frequency stays capped at 1/sec. We adapt only the total hourly
          # work budget: healthy runs use more of the runner; blocked runs cool down.
          limit=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/chart-dna-state.json")
          s=json.loads(p.read_text()) if p.exists() else {}
          attempted=int(s.get("attempted_last_run") or 0)
          succeeded=int(s.get("succeeded_last_run") or 0)
          blocked=bool(s.get("blocked_on_last_run"))
          ratio=(succeeded/attempted) if attempted else 1.0
          print(500 if blocked else 900 if ratio < .75 else 1600)
          PY
          )
          echo "Chart DNA hourly target: $limit charts (1 request/sec maximum)"
          python build_chart_dna.py --limit "$limit" --delay 1 --checkpoint-every 100 --max-minutes 32
      - name: Rebuild DNA research summary without touching metadata search shards
        run: python build_ranked_views.py --skip-search
      - name: Commit derived DNA only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/chart-dna data/chart-dna-manifest.json data/chart-dna-state.json data/ranked-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Backfill derived Ranked Chart DNA"
            git pull --rebase origin main
            git push
          fi
