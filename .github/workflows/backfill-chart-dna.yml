name: Backfill Ranked Chart DNA

on:
  push:
    paths:
      - '.github/workflows/backfill-chart-dna.yml'
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"

concurrency:
  group: osu-chart-dna-backfill
  cancel-in-progress: false

jobs:
  dna:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate analyzer
        run: |
          python -m py_compile build_chart_dna.py build_ranked_views.py
          python build_chart_dna.py --help
      - name: Analyze large recoverable DNA batch
        run: python build_chart_dna.py --limit 300 --delay 1.25 --checkpoint-every 25
      - name: Rebuild derived views
        run: python build_ranked_views.py
      - name: Commit derived DNA only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/chart-dna data/chart-dna-manifest.json data/chart-dna-state.json data/ranked-summary.json data/ranked-search
          if ! git diff --cached --quiet; then
            git commit -m "Backfill derived Ranked Chart DNA"
            git pull --rebase origin main
            git push
          fi
