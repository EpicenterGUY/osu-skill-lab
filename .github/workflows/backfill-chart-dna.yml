name: Backfill Ranked Chart DNA

on:
  workflow_dispatch:
  schedule:
    - cron: "43 * * * *"

concurrency:
  group: osu-chart-dna-backfill
  cancel-in-progress: false

jobs:
  dna:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    concurrency:
      # Serialize writes with the hourly Ranked metadata collector.
      group: osu-ranked-data-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate analyzer and UI contracts
        run: |
          python -m py_compile build_chart_dna.py build_ranked_views.py
          python -m unittest discover -s tests -q
          python build_chart_dna.py --help
      - name: Analyze large recoverable DNA batch
        # Keep a single request stream at <= 1 request/sec. Throughput comes from
        # longer batches and cheap incremental checkpoints, not parallel scraping.
        run: python build_chart_dna.py --limit 1000 --delay 1 --checkpoint-every 100 --max-minutes 38
      - name: Rebuild derived views
        run: python build_ranked_views.py
      - name: Commit derived DNA only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/chart-dna data/chart-dna-manifest.json data/chart-dna-state.json data/ranked-summary.json data/ranked-search
          if ! git diff --cached --quiet; then
            git commit -m "Backfill derived Ranked Chart DNA"
            git pull --rebase origin main
            git push
          fi
